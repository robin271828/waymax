[workspace]
name = "waymax"
version = "0.1.0"
description = "Waymax: An accelerated simulator for autonomous driving research"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.20"
jax = ">=0.4.6"
jaxlib = ">=0.4.6"
tensorflow = ">=2.11.0"
chex = ">=0.1.6"
dm-env = ">=1.6"
flax = ">=0.6.7"
matplotlib = ">=3.7.1"
dm-tree = ">=0.1.8"
immutabledict = ">=2.2.3"
pillow = ">=9.4.0"
mediapy = ">=1.1.6"
tqdm = ">=4.65.0"
absl-py = ">=1.4.0"
pytest = ">=7.0"
pip = ">=21.0"
imageio = ">=2.25"
imageio-ffmpeg = ">=0.4"
ffmpeg = ">=4.0"

[tasks]
# Development tasks
test = "pytest waymax/"
test-single = { cmd = "pytest", depends-on = [] }
lint = "echo 'Linting not configured yet'"

# Run the test simulation
test-sim = "python test_simulation.py"

# Run the multi-agent example
multiagent-example = "python examples/multiagent_simulation.py"

# Install the package in development mode
install-dev = "pip install -e ."

[feature.cuda]
# Optional CUDA support
channels = ["conda-forge", "nvidia"]
dependencies = { cuda-version = "12.*" }

[feature.dev]
dependencies = { jupyter = "*", ipython = "*" }
tasks = { notebook = "jupyter notebook" }

[environments]
# Default environment (no extra features)
default = []
# CUDA environment: pixi run -e cuda <command>
cuda = ["cuda"]
# Development environment with Jupyter: pixi run -e dev <command>
dev = ["dev"]
